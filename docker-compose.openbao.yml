services:
  openbao:
    build:
      context: .
      dockerfile: Dockerfile.openbao
    container_name: himitsu-vault-openbao
    ports:
      - "${OPENBAO_HOST_PORT:-8210}:8200"
    volumes:
      - openbao-file:/openbao/file
      - openbao-logs:/openbao/logs
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_API_ADDR=${OPENBAO_API_ADDR:-http://127.0.0.1:8210}
      - HIMITSU_UNSEAL_KEY=${HIMITSU_UNSEAL_KEY}
      - HIMITSU_ADMIN_USERNAME=${HIMITSU_ADMIN_USERNAME}
      - HIMITSU_ADMIN_PASSWORD=${HIMITSU_ADMIN_PASSWORD}
    command: server -config=/openbao/config/openbao.hcl
    restart: unless-stopped
    # Without this, a wedged-but-running process is never detected: `restart:
    # unless-stopped` only reacts to the process actually exiting.
    # sys/health returns 200 only when initialized AND unsealed AND active.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  ui-dev:
    build:
      context: .
      dockerfile: Dockerfile.ui-dev
    container_name: himitsu-vault-ui-dev
    depends_on:
      openbao:
        condition: service_healthy
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4200/ui/"]
      interval: 30s
      timeout: 5s
      retries: 5
      # the ember dev build takes ~2 minutes on a cold start
      start_period: 180s

volumes:
  openbao-file:
  openbao-logs:
