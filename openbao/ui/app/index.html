<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="cache-control" content="no-store" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>Himitsu Vault</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Inter / JetBrains Mono are self-hosted in public/fonts and loaded via app.scss @font-face rules — -->
    <!-- the app's CSP (config/content-security-policy.js) only allows style-src 'self', so no external font stylesheets here. -->
    <!-- Preload the critical font files so the browser fetches them in parallel with the CSS instead of -->
    <!-- after parsing it. font-display: swap (in app.scss) keeps text visible during the brief window. -->
    <link rel="preload" href="{{rootURL}}fonts/inter/inter-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="{{rootURL}}fonts/jetbrains-mono/jetbrains-mono-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    {{content-for "head"}}

    <link rel="stylesheet" href="{{rootURL}}assets/vendor.css">
    <link rel="stylesheet" href="{{rootURL}}assets/vault.css">
    <link rel="icon" type="image/svg" href="{{rootURL}}favicon.svg" />

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/vault.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
